[project]
name = "investiq"
version = "0.1.0"
description = "InvestIQ — grounded Indian-equity research with live public data and local AI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "fpdf2>=2.8.7",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "reportlab>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
